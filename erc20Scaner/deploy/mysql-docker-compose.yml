version: '3.8'

services:
  # MySQL数据库服务
  mysql-erc:
    image: mysql:8.0
    container_name: erc20-scanner-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "TODO"
      TZ: Asia/Shanghai
    ports:
      - "3316:3306"
    volumes:
      - ./mysql/data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      #- ./mysql/etc/my.cnf:/etc/my.cnf
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD-SHELL", "mysql -u root -pTODO -e 'SELECT 1' > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    network_mode: "host"

